name: Build OGX-Mini Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Define the corrected board names here
        board: [PI_PICO, PI_PICO2, PI_PICOW, RP2040_ZERO]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

    - name: Configure CMake
        run: |
          cmake -S Firmware/RP2040 \
                -B build_${{ matrix.board }} \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DOGXM_BOARD=${{ matrix.board }} \
                -DMAX_GAMEPADS=1

      - name: Build Firmware
        run: |
          cmake --build build_${{ matrix.board }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OGX-Mini-${{ matrix.board }}
          path: |
            build_${{ matrix.board }}/*.uf2
            build_${{ matrix.board }}/*.elf
