name: Build OGX-Mini

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        board:
          - PI_PICO
          - PI_PICO2
          - PI_PICOW
          - PI_PICO2W
          - RP2040_ZERO
          - ADAFRUIT_FEATHER
          - ESP32_BLUEPAD32_I2C
          - ESP32_BLUERETRO_I2C
          #- EXTERNAL_4CH_I2C

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev pkg-config

      - name: Get Pico SDK
        run: git clone --branch 2.1.0 --recurse-submodules https://github.com/raspberrypi/pico-sdk.git

      - name: Create Build and Output Folders
        run: mkdir -p build output

      - name: Build OGX-Mini - ${{ matrix.board }}
        run: |
          cd build
          rm -rf ./*
          
          # Определение PICO_BOARD для корректной компиляции на RP2350
          if [[ "${{ matrix.board }}" == "PI_PICO2" || "${{ matrix.board }}" == "PI_PICO2W" ]]; then
            BOARD_TARGET="pico2"
          elif [[ "${{ matrix.board }}" == "PI_PICOW" ]]; then
            BOARD_TARGET="pico_w"
          else
            BOARD_TARGET="pico"
          fi

          # Конфигурация через Ninja
          cmake -G Ninja \
                -DPICO_SDK_PATH=${{ github.workspace }}/pico-sdk \
                -DPICO_BOARD=$BOARD_TARGET \
                -DCMAKE_BUILD_TYPE=Release \
                -DOGXM_BOARD=${{ matrix.board }} \
                -DMAX_GAMEPADS=1 \
                ../Firmware/RP2040
          
          # Параллельная сборка на максимум доступных ядер
          cmake --build . --parallel $(nproc)

          # Безопасный поиск и копирование UF2 файла прошивки
          FILE=$(find . -maxdepth 1 -name "*.uf2" | head -n 1)
          if [ -n "$FILE" ]; then
            # Переименовываем файл при копировании, чтобы в релизах четко видеть имя платы из матрицы
            NEW_NAME="OGX-Mini-${{ matrix.board }}.uf2"
            cp "$FILE" ../output/$NEW_NAME
            echo "Successfully copied $FILE as $NEW_NAME to output directory."
          else
            echo "Error: No .uf2 file was generated by the build system!" && exit 1
          fi

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uf2-${{ matrix.board }}
          path: output/*.uf2

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: combined_output
          merge-multiple: true # Сливает файлы из всех матриц в одну общую папку

      - name: List Files
        run: ls -lh combined_output/

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2.2.2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "OGX-Mini Bleeding Edge Build"
          draft: true
          prerelease: true
          files: combined_output/*.uf2

      - name: Create Tagged Release
        uses: softprops/action-gh-release@v2.2.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: combined_output/*.uf2
